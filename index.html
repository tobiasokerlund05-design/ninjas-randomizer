<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ninjas Are Butterflies — Randomizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      background:
        radial-gradient(circle at 20% 20%, #5d28d9 0%, transparent 30%),
        radial-gradient(circle at 80% 20%, #be185d 0%, transparent 28%),
        linear-gradient(135deg, #090914, #151126);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .logo {
      font-size: 70px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;

      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 900;
      letter-spacing: -3px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #c4b5fd,
        #f9a8d4
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #b7b4c9;
      font-size: 1.1rem;
      margin: 15px 0 35px;
    }

    .card {
      background: rgba(20, 18, 35, .85);

      border: 1px solid rgba(255,255,255,.12);

      border-radius: 28px;

      padding: 25px;

      box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.05);

      backdrop-filter: blur(20px);
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;

      object-fit: cover;

      border-radius: 18px;

      margin-bottom: 25px;

      background: #08080f;
    }

    .episode-label {
      display: inline-block;

      padding: 7px 13px;

      border-radius: 999px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #db2777
      );

      font-size: .8rem;
      font-weight: bold;

      margin-bottom: 15px;
    }

    h2 {
      font-size: clamp(1.5rem, 4vw, 2.4rem);

      line-height: 1.15;

      margin: 0 0 25px;
    }

    .buttons {
      display: flex;
      gap: 12px;

      justify-content: center;

      flex-wrap: wrap;
    }

    button,
    .watch {
      border: none;

      border-radius: 14px;

      padding: 16px 25px;

      font-size: 1rem;

      font-weight: 800;

      cursor: pointer;

      text-decoration: none;

      transition: .2s;
    }

    button:hover,
    .watch:hover {
      transform: translateY(-3px);
    }

    .random {
      color: white;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #db2777
      );

      box-shadow:
        0 10px 30px rgba(124,58,237,.35);
    }

    .watch {
      color: white;

      background: rgba(255,255,255,.1);

      border: 1px solid rgba(255,255,255,.15);
    }

    .hint {
      color: #77748a;

      font-size: .8rem;

      margin-top: 25px;
    }

    footer {
      color: #656174;

      font-size: .8rem;

      margin-top: 25px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 18px;
        border-radius: 22px;
      }

      .logo {
        font-size: 50px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      🥷🦋
    </div>

    <h1>
      Ninjas Are Butterflies
    </h1>

    <p class="subtitle">
      Let the ninja choose your next episode.
    </p>

    <div class="card">

      <img
        id="thumbnail"
        class="thumbnail"
        src="https://i.ytimg.com/vi/2DcYAtOEB_E/maxresdefault.jpg"
        alt="Ninjas Are Butterflies episode"
      >

      <div class="episode-label">
        RANDOM EPISODE
      </div>

      <h2 id="title">
        Ready to roll the dice?
      </h2>

      <div class="buttons">

        <button
          class="random"
          onclick="randomEpisode()"
        >
          🎲 Random Episode
        </button>

        <a
          id="watch"
          class="watch"
          href="https://www.youtube.com/watch?v=2DcYAtOEB_E"
          target="_blank"
          rel="noopener"
        >
          ▶ Watch on YouTube
        </a>

      </div>

      <div class="hint">
        Every click picks another episode from the playlist.
      </div>

    </div>

    <footer>
      Fan-made Ninjas Are Butterflies episode randomizer
    </footer>

  </main>


  <script>

    /*
      ==========================================================
      NINJAS ARE BUTTERFLIES YOUTUBE PLAYLIST
      ==========================================================

      Playlist:
      PLnrQGD2lbP5nrWwhSi9SjNTTstqHIaMPR

      Add YouTube video IDs below.

      A YouTube video ID is the part after:
      youtube.com/watch?v=

      Example:

      https://www.youtube.com/watch?v=2DcYAtOEB_E

      Video ID:
      2DcYAtOEB_E
    */


    const episodes = [

      {
        id: "2DcYAtOEB_E",
        title: "Ninjas Are Butterflies"
      },

      /*
        ADD MORE VIDEOS HERE.

        Example:

        {
          id: "ABC123XYZ",
          title: "Episode Title"
        },

        {
          id: "DEF456XYZ",
          title: "Another Episode"
        }
      */

    ];


    let currentEpisode = null;


    function randomEpisode() {

      if (episodes.length === 0) {

        alert(
          "You need to add the YouTube videos to the episode list."
        );

        return;
      }


      /*
        Pick a random episode.
      */

      let randomIndex =
        Math.floor(
          Math.random() * episodes.length
        );


      /*
        Don't immediately pick the same episode
        twice in a row if there is more than one.
      */

      if (
        episodes.length > 1 &&
        episodes[randomIndex] === currentEpisode
      ) {

        randomIndex =
          (randomIndex + 1) %
          episodes.length;
      }


      currentEpisode =
        episodes[randomIndex];


      /*
        Update title.
      */

      document.getElementById("title").textContent =
        currentEpisode.title;


      /*
        Update YouTube thumbnail.
      */

      document.getElementById("thumbnail").src =
        "https://i.ytimg.com/vi/" +
        currentEpisode.id +
        "/maxresdefault.jpg";


      /*
        Update Watch button.
      */

      document.getElementById("watch").href =
        "https://www.youtube.com/watch?v=" +
        currentEpisode.id;

    }


  </script>

</body>
</html>
