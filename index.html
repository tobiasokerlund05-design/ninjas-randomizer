<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ninjas Are Butterflies — Random Episode</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(124, 58, 237, .45),
          transparent 30%
        ),

        radial-gradient(
          circle at 85% 15%,
          rgba(219, 39, 119, .35),
          transparent 30%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(37, 99, 235, .25),
          transparent 35%
        ),

        #080810;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;

      overflow-x: hidden;
    }


    /* Floating decorations */

    .butterfly {
      position: fixed;

      font-size: 55px;

      opacity: .12;

      pointer-events: none;

      animation:
        float 7s ease-in-out infinite;
    }

    .b1 {
      top: 8%;
      left: 7%;
    }

    .b2 {
      bottom: 10%;
      right: 8%;

      animation-delay: 2s;
    }

    .b3 {
      top: 55%;
      left: 4%;

      animation-delay: 4s;
    }


    @keyframes float {

      0%, 100% {
        transform:
          translateY(0)
          rotate(-5deg);
      }

      50% {
        transform:
          translateY(-25px)
          rotate(5deg);
      }
    }


    .container {
      width: 100%;
      max-width: 850px;

      text-align: center;

      position: relative;
      z-index: 2;
    }


    .logo {
      font-size: 70px;

      margin-bottom: 5px;
    }


    h1 {

      margin: 0;

      font-size:
        clamp(2.5rem, 8vw, 5rem);

      line-height: .95;

      font-weight: 900;

      letter-spacing: -4px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #c4b5fd,
          #f9a8d4
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }


    .subtitle {

      margin:
        18px auto
        35px;

      color: #aaa8bc;

      font-size: 1.1rem;

      line-height: 1.5;
    }


    .card {

      background:
        rgba(18, 17, 31, .88);

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 28px;

      padding: 28px;

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.5),

        inset 0 1px
        rgba(255,255,255,.05);

      backdrop-filter: blur(20px);
    }


    #player {

      width: 100%;

      aspect-ratio: 16 / 9;

      border-radius: 18px;

      overflow: hidden;

      background: #000;

      margin-bottom: 25px;
    }


    #player iframe {

      width: 100% !important;
      height: 100% !important;
    }


    .episode-label {

      display: inline-block;

      padding:
        7px 14px;

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #db2777
        );

      font-size: .8rem;

      font-weight: 800;

      margin-bottom: 14px;
    }


    #episodeTitle {

      margin: 0;

      font-size:
        clamp(1.5rem, 5vw, 2.5rem);

      line-height: 1.15;

      font-weight: 850;
    }


    #status {

      color: #77748a;

      margin:
        15px 0
        25px;

      min-height: 20px;
    }


    .buttons {

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }


    button {

      border: none;

      border-radius: 14px;

      padding:
        16px 25px;

      font-size: 1rem;

      font-weight: 800;

      cursor: pointer;

      color: white;

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
    }


    button:hover {

      transform:
        translateY(-3px);
    }


    button:active {

      transform:
        translateY(0);
    }


    #randomButton {

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #db2777
        );

      box-shadow:
        0 10px 35px
        rgba(124,58,237,.35);

      min-width: 220px;
    }


    #watchButton {

      background:
        rgba(255,255,255,.09);

      border:
        1px solid
        rgba(255,255,255,.12);

      text-decoration: none;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      color: white;

      border-radius: 14px;

      padding:
        16px 25px;

      font-weight: 800;
    }


    #watchButton:hover {

      transform:
        translateY(-3px);

      background:
        rgba(255,255,255,.14);
    }


    footer {

      margin-top: 25px;

      color: #656274;

      font-size: .8rem;
    }


    .loading {

      padding: 20px;

      color: #aaa8bc;
    }


    .spinner {

      width: 35px;
      height: 35px;

      border:
        4px solid
        rgba(255,255,255,.1);

      border-top-color:
        #a855f7;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      margin:
        0 auto
        15px;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }
    }


    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 18px;
        border-radius: 22px;
      }

      .logo {
        font-size: 50px;
      }

      h1 {
        letter-spacing: -2px;
      }

      #randomButton,
      #watchButton {
        width: 100%;
      }
    }

  </style>

</head>


<body>

  <div class="butterfly b1">
    🦋
  </div>

  <div class="butterfly b2">
    🥷
  </div>

  <div class="butterfly b3">
    🦋
  </div>


  <main class="container">

    <div class="logo">
      🥷🦋
    </div>


    <h1>
      Ninjas Are Butterflies
    </h1>


    <p class="subtitle">
      Don't know what episode to listen to?
      <br>
      Let the ninja choose.
    </p>


    <section class="card">


      <div id="player">

        <div class="loading">

          <div class="spinner"></div>

          Loading the ninja archives...

        </div>

      </div>


      <div class="episode-label">
        RANDOM EPISODE
      </div>


      <h2 id="episodeTitle">
        Getting the episodes...
      </h2>


      <div id="status">
        Connecting to YouTube...
      </div>


      <div class="buttons">

        <button
          id="randomButton"
          onclick="randomEpisode()"
          disabled
        >
          🎲 Random Episode
        </button>


        <a
          id="watchButton"
          href="#"
          target="_blank"
          rel="noopener"
        >
          ▶ Watch on YouTube
        </a>

      </div>

    </section>


    <footer>

      Fan-made episode randomizer

    </footer>

  </main>


  <!--
    ==========================================================
    YOUTUBE PLAYER API
    ==========================================================
  -->

  <script
    src="https://www.youtube.com/iframe_api">
  </script>


  <script>

    /*
      ==========================================================
      YOUR PLAYLIST
      ==========================================================
    */

    const PLAYLIST_ID =
      "PLnrQGD2lbP5nrWwhSi9SjNTTstqHIaMPR";


    let player;

    let videos = [];

    let currentVideo = null;


    /*
      ==========================================================
      YOUTUBE CREATES THE PLAYER HERE
      ==========================================================
    */

    function onYouTubeIframeAPIReady() {

      player =
        new YT.Player(
          "player",
          {

            width: "100%",

            height: "100%",

            playerVars: {

              /*
                Load YOUR playlist.
              */

              listType: "playlist",

              list:
                PLAYLIST_ID,

              /*
                Don't automatically start
                playing when the page loads.
              */

              autoplay: 0,

              /*
                YouTube branding.
              */

              modestbranding: 1,

              /*
                Keep controls visible.
              */

              controls: 1

            },


            events: {

              onReady:
                playerReady,

              onError:
                playerError

            }

          }
        );

    }


    /*
      ==========================================================
      PLAYER READY
      ==========================================================
    */

    function playerReady() {

      /*
        Give YouTube a moment to finish loading
        the playlist.
      */

      setTimeout(
        getPlaylist,
        1500
      );

    }


    /*
      ==========================================================
      GET VIDEOS FROM THE PLAYLIST
      ==========================================================
    */

    function getPlaylist() {

      if (!player) {

        return;
      }


      const playlist =
        player.getPlaylist();


      if (
        playlist &&
        playlist.length > 0
      ) {

        videos = playlist;


        document.getElementById(
          "randomButton"
        ).disabled = false;


        document.getElementById(
          "status"
        ).textContent =
          videos.length +
          " episodes loaded from YouTube.";


        /*
          Pick the first random episode.
        */

        randomEpisode();

      }

      else {

        /*
          Sometimes YouTube takes longer
          to populate the playlist.
        */

        setTimeout(
          getPlaylist,
          1500
        );

      }

    }


    /*
      ==========================================================
      RANDOM EPISODE
      ==========================================================
    */

    function randomEpisode() {

      if (
        !videos ||
        videos.length === 0
      ) {

        return;
      }


      let randomIndex;


      /*
        Make sure we don't pick the
        exact same episode twice in
        a row when possible.
      */

      do {

        randomIndex =
          Math.floor(
            Math.random() *
            videos.length
          );

      }

      while (
        videos.length > 1 &&
        videos[randomIndex] === currentVideo
      );


      currentVideo =
        videos[randomIndex];


      /*
        Tell YouTube to load the
        randomly selected video.
      */

      player.cueVideoById(
        currentVideo
      );


      /*
        Get the video's title.
      */

      setTimeout(
        updateEpisodeInfo,
        300
      );

    }


    /*
      ==========================================================
      UPDATE TITLE / WATCH LINK
      ==========================================================
    */

    function updateEpisodeInfo() {

      if (!player) {
        return;
      }


      const data =
        player.getVideoData();


      if (
        data &&
        data.video_id
      ) {

        const videoID =
          data.video_id;


        const title =
          data.title ||
          "Ninjas Are Butterflies";


        document.getElementById(
          "episodeTitle"
        ).textContent =
          title;


        document.getElementById(
          "status"
        ).textContent =
          "The ninja has chosen.";


        document.getElementById(
          "watchButton"
        ).href =
          "https://www.youtube.com/watch?v=" +
          videoID;

      }

    }


    /*
      ==========================================================
      YOUTUBE ERROR
      ==========================================================
    */

    function playerError(error) {

      console.log(
        "YouTube error:",
        error
      );


      document.getElementById(
        "status"
      ).textContent =
        "YouTube couldn't load the playlist. Try refreshing the page.";

    }

  </script>

</body>
</html>
