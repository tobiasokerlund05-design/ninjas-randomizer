<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ninjas Are Butterflies — Random Episode</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(112, 63, 255, .35), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(255, 79, 216, .25), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(0, 212, 255, .18), transparent 35%),
        #080812;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .butterfly {
      position: fixed;
      font-size: 50px;
      opacity: .12;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .b1 { top: 8%; left: 8%; }
    .b2 { top: 65%; right: 8%; animation-delay: 2s; }
    .b3 { bottom: 8%; left: 18%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-25px) rotate(5deg); }
    }

    .container {
      width: 100%;
      max-width: 760px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.2rem);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(90deg, #fff, #bfa5ff, #ff8eea);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 18px auto 35px;
      color: #aaaabd;
      font-size: 1.05rem;
    }

    .card {
      background: rgba(19, 19, 32, .78);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 28px;
      padding: 34px;
      text-align: left;
      box-shadow:
        0 25px 80px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.05);
      backdrop-filter: blur(20px);
    }

    .episode-number {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 999px;
      background: linear-gradient(135deg, #7b4dff, #d64cff);
      font-weight: 800;
      font-size: .85rem;
      margin-bottom: 15px;
    }

    .episode-title {
      font-size: clamp(1.5rem, 4vw, 2.35rem);
      line-height: 1.1;
      margin: 0 0 12px;
      font-weight: 850;
    }

    .date {
      color: #85859a;
      margin-bottom: 22px;
      font-size: .9rem;
    }

    .description {
      color: #c8c8d5;
      line-height: 1.7;
      font-size: .98rem;
      max-height: 210px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    button, .listen {
      border: 0;
      border-radius: 14px;
      padding: 15px 22px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover, .listen:hover {
      transform: translateY(-2px);
    }

    .random-btn {
      flex: 1;
      min-width: 190px;
      color: white;
      background: linear-gradient(135deg, #7b4dff, #d846ff);
      box-shadow: 0 10px 30px rgba(137, 67, 255, .3);
    }

    .listen {
      color: white;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
    }

    .loading {
      text-align: center;
      color: #aaaabd;
      padding: 50px 20px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,.12);
      border-top-color: #b76cff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      color: #ff9eae;
      line-height: 1.6;
    }

    footer {
      margin-top: 25px;
      color: #68687c;
      font-size: .8rem;
    }

    footer a {
      color: #9c7cff;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 24px;
        border-radius: 22px;
      }

      .logo {
        font-size: 48px;
      }

      h1 {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <div class="butterfly b1">🦋</div>
  <div class="butterfly b2">🥷</div>
  <div class="butterfly b3">🦋</div>

  <main class="container">

    <div class="logo">🥷🦋</div>

    <h1>Ninjas Are Butterflies</h1>

    <p class="subtitle">
      Can't decide what episode to listen to?<br>
      Let the ninja choose.
    </p>

    <section class="card" id="episodeCard">
      <div class="loading">
        <div class="spinner"></div>
        Loading the butterfly archives...
      </div>
    </section>

    <footer>
      Fan-made random episode picker ·
      <a href="https://podcasts.apple.com/us/podcast/ninjas-are-butterflies/id1641726131"
         target="_blank" rel="noopener">
        Ninjas Are Butterflies
      </a>
    </footer>

  </main>

  <script>
    const RSS_URL =
      "https://feeds.megaphone.fm/FNSSB1459482001";

    let episodes = [];

    /*
      We use AllOrigins as a free CORS bridge so the static website
      can read the podcast's RSS feed directly from the browser.
    */
    const FEED_URL =
      "https://api.allorigins.win/raw?url=" +
      encodeURIComponent(RSS_URL);

    async function loadEpisodes() {
      try {
        const response = await fetch(FEED_URL);

        if (!response.ok) {
          throw new Error("Could not load podcast feed.");
        }

        const xmlText = await response.text();

        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");

        const items = [...xml.querySelectorAll("item")];

        episodes = items.map(item => {
          const title =
            item.querySelector("title")?.textContent?.trim() ||
            "Untitled Episode";

          const description =
            item.querySelector("description")?.textContent?.trim() ||
            "";

          const pubDate =
            item.querySelector("pubDate")?.textContent?.trim() ||
            "";

          const link =
            item.querySelector("link")?.textContent?.trim() ||
            "#";

          const enclosure =
            item.querySelector("enclosure")?.getAttribute("url") ||
            "";

          return {
            title,
            description: cleanHTML(description),
            pubDate,
            link,
            enclosure
          };
        });

        if (!episodes.length) {
          throw new Error("No episodes were found.");
        }

        randomEpisode();

      } catch (error) {
        console.error(error);

        document.getElementById("episodeCard").innerHTML = `
          <div class="loading error">
            <h2>🥷 The ninjas are hiding the episodes.</h2>
            <p>
              The podcast feed couldn't be loaded right now.
              Try refreshing the page in a moment.
            </p>
            <button class="random-btn" onclick="loadEpisodes()">
              Try Again
            </button>
          </div>
        `;
      }
    }

    function cleanHTML(html) {
      const temp = document.createElement("div");
      temp.innerHTML = html;

      return temp.textContent
        .replace(/\s+/g, " ")
        .trim();
    }

    function randomEpisode() {
      if (!episodes.length) return;

      const episode =
        episodes[Math.floor(Math.random() * episodes.length)];

      displayEpisode(episode);
    }

    function displayEpisode(episode) {
      const card = document.getElementById("episodeCard");

      const formattedDate = episode.pubDate
        ? new Date(episode.pubDate).toLocaleDateString(
            undefined,
            {
              year: "numeric",
              month: "long",
              day: "numeric"
            }
          )
        : "";

      card.innerHTML = `
        <div class="episode-number">
          RANDOM EPISODE
        </div>

        <h2 class="episode-title">
          ${escapeHTML(episode.title)}
        </h2>

        <div class="date">
          ${escapeHTML(formattedDate)}
        </div>

        <div class="description">
          ${escapeHTML(episode.description)}
        </div>

        <div class="buttons">

          <button class="random-btn" onclick="randomEpisode()">
            🥷 Randomize Again
          </button>

          ${
            episode.link !== "#"
              ? `<a class="listen"
                   href="${escapeAttribute(episode.link)}"
                   target="_blank"
                   rel="noopener">
                   🎧 Listen
                 </a>`
              : ""
          }

        </div>
      `;
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    loadEpisodes();
  </script>

</body>
</html>
